services:
  redis:
    image: redis:7-alpine
    container_name: ulpf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ulpf-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: ulpf-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      # Local development defaults only — override via the environment (or a
      # .env file) for anything that is not a throwaway stack.
      POSTGRES_USER: "${POSTGRES_USER:-logmorph}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-logmorph}"
      POSTGRES_DB: "${POSTGRES_DB:-logmorph}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logmorph} -d ${POSTGRES_DB:-logmorph}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    container_name: ulpf-ingestion
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      # Use Docker Compose service name — never hardcode localhost.
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      RAW_STREAM_NAME: "${RAW_STREAM_NAME:-raw_events}"
      RAW_EVENT_STREAM_MAXLEN: "${RAW_EVENT_STREAM_MAXLEN:-100000}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ulpf-worker
    environment:
      # Use Docker Compose service names — never hardcode localhost.
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      RAW_STREAM_NAME: "${RAW_STREAM_NAME:-raw_events}"
      CONSUMER_GROUP: "${CONSUMER_GROUP:-ulpf-worker-group}"
      CONSUMER_NAME: "${CONSUMER_NAME:-worker-1}"
      RAW_EVENT_STREAM_MAXLEN: "${RAW_EVENT_STREAM_MAXLEN:-100000}"
      RAW_EVENT_CLAIM_IDLE_MS: "${RAW_EVENT_CLAIM_IDLE_MS:-60000}"
      WORKER_BATCH_SIZE: "${WORKER_BATCH_SIZE:-10}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      IDEMPOTENCY_LOCK_TTL_S: "${IDEMPOTENCY_LOCK_TTL_S:-120}"
      IDEMPOTENCY_DONE_TTL_S: "${IDEMPOTENCY_DONE_TTL_S:-86400}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadminpassword}"
      MINIO_BUCKET: "${MINIO_BUCKET:-raw-events}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"
      # PostgreSQL normalized + quarantine store (service name, not localhost).
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-logmorph}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-logmorph}"
      POSTGRES_DB: "${POSTGRES_DB:-logmorph}"
      POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-disable}"
      # Bounds retries of a retryable failure before it is quarantined.
      WORKER_MAX_ATTEMPTS: "${WORKER_MAX_ATTEMPTS:-10}"
      WORKER_ATTEMPT_TTL_S: "${WORKER_ATTEMPT_TTL_S:-86400}"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The worker applies schema migrations at startup, so the database must
      # be accepting connections, not merely started.
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
  postgres-data:
