services:
  redis:
    image: redis:7-alpine
    container_name: ulpf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ulpf-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    container_name: ulpf-ingestion
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      # Use Docker Compose service name — never hardcode localhost.
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      RAW_STREAM_NAME: "${RAW_STREAM_NAME:-raw_events}"
      RAW_EVENT_STREAM_MAXLEN: "${RAW_EVENT_STREAM_MAXLEN:-100000}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ulpf-worker
    environment:
      # Use Docker Compose service names — never hardcode localhost.
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      RAW_STREAM_NAME: "${RAW_STREAM_NAME:-raw_events}"
      CONSUMER_GROUP: "${CONSUMER_GROUP:-ulpf-worker-group}"
      CONSUMER_NAME: "${CONSUMER_NAME:-worker-1}"
      RAW_EVENT_STREAM_MAXLEN: "${RAW_EVENT_STREAM_MAXLEN:-100000}"
      RAW_EVENT_CLAIM_IDLE_MS: "${RAW_EVENT_CLAIM_IDLE_MS:-60000}"
      WORKER_BATCH_SIZE: "${WORKER_BATCH_SIZE:-10}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      IDEMPOTENCY_LOCK_TTL_S: "${IDEMPOTENCY_LOCK_TTL_S:-120}"
      IDEMPOTENCY_DONE_TTL_S: "${IDEMPOTENCY_DONE_TTL_S:-86400}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadminpassword}"
      MINIO_BUCKET: "${MINIO_BUCKET:-raw-events}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
